# ============================================================
# 部署模式：MySQL 8
# 连接参数均可通过环境变量覆盖：DB_URL / DB_USER / DB_PASSWORD
# 首次启动自动执行 db/migration/mysql + common 下的 Flyway 迁移建表
# ============================================================
spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/datalink?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}"
    username: ${DB_USER:datalink}
    password: ${DB_PASSWORD:datalink123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/migration/mysql,classpath:db/migration/common

datalink:
  db-type: mysql
